name: tf-plan-summary
description: Post a human-readable Terraform plan summary as a sticky PR comment.
branding:
  icon: file-text
  color: purple

inputs:
  plan-json:
    description: Path to `terraform show -json` output.
    required: true
  github-token:
    description: Token used to post the PR comment (usually secrets.GITHUB_TOKEN).
    required: true
  marker:
    description: Hidden marker identifying the sticky comment.
    required: false
    default: "<!-- tf-plan-summary -->"
  pr-number:
    description: >-
      Pull request to comment on. Defaults to the PR that triggered the run; set
      it explicitly on triggers other than `pull_request`. When it is empty the
      summary is still rendered, but no comment is posted.
    required: false
    default: ${{ github.event.pull_request.number }}
  protect:
    description: >-
      Protected resources, one glob per line. A glob matches the full address,
      the resource type, or the address inside its module, e.g.
      `aws_db_instance` or `module.data.*`.
    required: false
    default: ""
  ignore-risk:
    description: >-
      Resources whose replace/destroy/forget does not count towards `has-risk`,
      one glob per line. `protect` wins when both match.
    required: false
    default: ""
  fail-on:
    description: >-
      Fail the step on `risk` (has-risk), `critical` (a protected resource is
      destroyed or replaced), or `never`. The comment is posted first.
    required: false
    default: never
  version:
    description: tf-plan-summary version to install (git ref).
    required: false
    default: latest
  go-version:
    description: Go toolchain used to install the CLI.
    required: false
    default: stable

outputs:
  summary-file:
    description: Path to the rendered Markdown summary.
    value: ${{ steps.summary.outputs.summary-file }}
  create:
    description: Number of resources to create.
    value: ${{ steps.summary.outputs.create }}
  update:
    description: Number of resources to update in place.
    value: ${{ steps.summary.outputs.update }}
  replace:
    description: Number of resources to replace (create+delete, either ordering).
    value: ${{ steps.summary.outputs.replace }}
  destroy:
    description: Number of resources to destroy.
    value: ${{ steps.summary.outputs.destroy }}
  forget:
    description: Number of resources to drop from state without destroying.
    value: ${{ steps.summary.outputs.forget }}
  unknown:
    description: Number of changes this version could not classify.
    value: ${{ steps.summary.outputs.unknown }}
  total:
    description: Total changes (excludes no-op and read).
    value: ${{ steps.summary.outputs.total }}
  has-risk:
    description: "`true` when the plan replaces, destroys, or forgets anything not exempted by `ignore-risk`."
    value: ${{ steps.summary.outputs.has-risk }}
  protected-destroy:
    description: Number of protected resources to destroy.
    value: ${{ steps.summary.outputs.protected-destroy }}
  protected-replace:
    description: Number of protected resources to replace.
    value: ${{ steps.summary.outputs.protected-replace }}
  has-critical-risk:
    description: "`true` when the plan destroys or replaces a protected resource."
    value: ${{ steps.summary.outputs.has-critical-risk }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install tf-plan-summary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: go install "github.com/moveeeax/tf-plan-summary@${VERSION}"

    # Inputs are passed through the environment rather than interpolated into
    # the script, so a value containing shell metacharacters cannot run as code.
    - name: Post plan summary
      id: summary
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PLAN_JSON: ${{ inputs.plan-json }}
        MARKER: ${{ inputs.marker }}
        PROTECT: ${{ inputs.protect }}
        IGNORE_RISK: ${{ inputs.ignore-risk }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        summary="${RUNNER_TEMP}/tf-plan-summary.md"
        if [ -z "${PR_NUMBER}" ]; then
          echo "::warning title=tf-plan-summary::No pull request number available; rendering the summary without posting a comment."
        fi
        args=(--plan-json "${PLAN_JSON}" --marker "${MARKER}" --output "${summary}" --fail-on "${FAIL_ON}")
        # One glob per line; blank lines and surrounding spaces are dropped.
        while IFS= read -r glob; do
          glob="$(printf '%s' "${glob}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -n "${glob}" ]; then args+=(--protect "${glob}"); fi
        done <<< "${PROTECT}"
        while IFS= read -r glob; do
          glob="$(printf '%s' "${glob}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -n "${glob}" ]; then args+=(--ignore-risk "${glob}"); fi
        done <<< "${IGNORE_RISK}"
        # The CLI appends its step outputs to $GITHUB_OUTPUT itself. A tripped
        # fail-on gate exits 2 after everything is written; the summary is
        # still published before the step fails.
        rc=0
        "$(go env GOPATH)/bin/tf-plan-summary" "${args[@]}" || rc=$?
        if [ -f "${summary}" ]; then
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${summary}"
        fi
        exit "${rc}"
