# Example: summarize a Terraform plan on every PR.
# Copy into .github/workflows/ and adjust the plan step to your setup.
name: terraform-plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # required to post the sticky comment

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform plan → JSON
        run: |
          terraform init -input=false
          terraform plan -out=plan.bin -input=false
          terraform show -json plan.bin > plan.json

      - name: Summarize plan on the PR
        id: summary
        uses: moveeeax/tf-plan-summary@v1
        with:
          plan-json: plan.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional policy: protected resources are pinned at the top of the
          # comment, and fail-on: critical fails the job when one is destroyed
          # or replaced (the comment is still posted).
          # protect: |
          #   aws_db_instance
          #   module.data.*
          # ignore-risk: |
          #   null_resource
          # fail-on: critical

      # Optional gate: fail the job when the plan replaces, destroys or forgets
      # anything, so a destructive plan cannot be merged unnoticed.
      - name: Flag destructive plans
        if: steps.summary.outputs.has-risk == 'true'
        env:
          DESTROY: ${{ steps.summary.outputs.destroy }}
          REPLACE: ${{ steps.summary.outputs.replace }}
          FORGET: ${{ steps.summary.outputs.forget }}
        run: |
          echo "::error::Plan destroys ${DESTROY}, replaces ${REPLACE}, forgets ${FORGET} resource(s)."
          exit 1
