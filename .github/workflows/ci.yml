name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/tf-plan-summary .

      - name: Smoke-test (render fixture)
        run: |
          out=$(/tmp/tf-plan-summary --plan-json testdata/plan.json)
          echo "$out"
          echo "$out" | grep -q '\*\*2\*\* to add'
          echo "$out" | grep -q '1 to destroy'
          echo "$out" | grep -q '<details>'

      - name: Smoke-test (a state document must not render as "no changes")
        run: |
          echo '{"format_version":"1.0","values":{"root_module":{}}}' > /tmp/state.json
          if /tmp/tf-plan-summary --plan-json /tmp/state.json; then
            echo "expected a failure for a non-plan document"; exit 1
          fi

      - name: action.yml outputs match the CLI
        run: |
          raw=$(mktemp); emitted=$(mktemp); declared=$(mktemp)
          GITHUB_OUTPUT="$raw" /tmp/tf-plan-summary \
            --plan-json testdata/plan_modules.json --output /dev/null
          cut -d= -f1 "$raw" | sort -u > "$emitted"
          grep -o 'steps\.summary\.outputs\.[a-z-]*' action.yml \
            | sed 's/.*outputs\.//' | sort -u > "$declared"
          missing=$(comm -23 "$declared" "$emitted")
          if [ -n "$missing" ]; then
            echo "action.yml declares outputs the CLI never emits:"; echo "$missing"; exit 1
          fi
